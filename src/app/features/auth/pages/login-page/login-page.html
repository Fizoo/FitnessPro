<div class="container"
  [class.active]="isActiveClass()"
>
  <div class="form-box login">
    <form action="">
      <h1>Login</h1>

      <div class="input-box">
        <input type="text" placeholder="Username" required>
        <fa-icon class="icon" [icon]="faUser"></fa-icon>
      </div>

      <div class="input-box">
        <input type="password" placeholder="Password" required>
        <fa-icon class="icon" [icon]="faLock"></fa-icon>
      </div>

      <div class="forgot-link">
        <a href="">Forgot password?</a>
      </div>

      <button type="submit" class="btn">Login</button>
      <p>or login with social platforms</p>

      <div class="social-icons">
        <a href="">
          <fa-icon [icon]="faGoogle"></fa-icon>
        </a>
        <a href="">
          <fa-icon [icon]="faFacebook"></fa-icon>
        </a>
        <a href="">
          <fa-icon [icon]="faGithub"></fa-icon>

        </a>
      </div>

    </form>
  </div>

  <div class="form-box register">
    <form action="">
      <h1>Registration</h1>

      <div class="input-box">
        <input type="text" placeholder="Username" required>
        <fa-icon class="icon" [icon]="faUser"></fa-icon>
      </div>

      <div class="input-box">
        <input type="text" placeholder="Email" required>
        <fa-icon class="icon" [icon]="faEnvelope"></fa-icon>
        <mat-icon class="icon" aria-hidden="false"  >person</mat-icon>
      </div>

      <div class="input-box">
        <input type="password" placeholder="Password" required>
        <fa-icon class="icon" [icon]="faLock"></fa-icon>
      </div>



      <button type="submit" class="btn">Register</button>
      <p>or register with social platforms</p>

      <div class="social-icons">
        <a href="">
          <fa-icon [icon]="faGoogle"></fa-icon>
        </a>
        <a href="">
          <fa-icon [icon]="faFacebook"></fa-icon>
        </a>
        <a href="">
          <fa-icon [icon]="faGithub"></fa-icon>

        </a>
      </div>

    </form>
  </div>

  <div class="toggle-box">
    <div class="toggle-panel toggle-left">
      <h1>Hello, Welcome!</h1>
      <p>Don't have an account?</p>
      <button (click)="showRegister()" class="btn register-btn">Register</button>
    </div>
    <div class="toggle-panel toggle-right">
      <h1>Welcome Back!</h1>
      <p>Already have an account?</p>
      <button (click)="showLogin()" class="btn login-btn">Login</button>
    </div>
  </div>

</div>
