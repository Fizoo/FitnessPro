<div class="exercise-list">

  @if (store.isLoading()) {
    <div class="skeleton-grid">
      @for (i of [1,2,3,4,5,6,7,8]; track i) {
        <div class="skeleton-card"></div>
      }
    </div>
  }

  @if (store.isEmpty()) {
    <p class="no-results">Вправи не знайдено</p>
  }


  <div class="exercise-grid">
    @for (ex of store.filteredExercises(); track ex.id) {
      <app-exercise-card
        [exercise]="ex"
        (click)="onExerciseSelected(ex)"
      />
    }
  </div>

  <div
    appInfiniteScroll
    [canLoad]="store.hasMore()"
    [loading]="store.isLoadingMore()"
    (loadMore)="onLoadMore()"
    class="sentinel"
  >
    @if (store.isLoadingMore()) {
      <div class="load-more-spinner">
        <span class="spinner"></span>
        <span>Завантаження...</span>
      </div>
    }
  </div>

</div>
