@if (bodyPartStore.isLoading()) {
  <p>Завантаження...</p>
}

@if (bodyPartStore.error(); as err) {
  <p class="error">{{ err }}</p>
}

<!-- Success state -->

<div class="muscle-groups">
  @for (group of filteredGroups(); track group.id) {
    <app-muscle-card
      [muscleGroup]="group"
      (click)="onMuscleGroupClick(group.name)"
    />
  }
</div>
