<div class="exercises-page">
  @if (!isDetailPage()) {
    <app-header-exercise
      title="Exercises"
      (back)="onBack()"
      [showBookmark]="true"
      [showFilter]="true"
    />
    <div class="search-container">
      <i class="material-icons">search</i>
      <input
        type="text"
        placeholder="Search"
        [value]="store.searchQuery()"
        #searchInput
        (input)="store.setSearch(searchInput.value)"
      >
    </div>
  }
  <div class="content">
    <router-outlet></router-outlet>
  </div>
</div>
