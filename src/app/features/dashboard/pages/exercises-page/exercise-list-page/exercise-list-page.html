@if (list(); as el) {
  <div class="exercise-list">
    @for (exercise of el; track exercise.name) {
      <app-exercise-card
        [exercise]="exercise"
        [isSelected]="isExerciseSelected(exercise.name)"
        (selected)="onExerciseSelected($event)"
      />
    } @empty {
      <p class="no-results">No exercises found</p>
    }
  </div>
}
