<mat-toolbar class="header" color="transparent">
  <!-- ЛОГО -->
  <a routerLink="/" class="logo">
    <span>FitnessPro</span>
    <img src="/assets/img/logo-nav.png" alt="Fitness">
  </a>

  <span class="spacer"></span>

  <!-- ІКОНКИ ДЛЯ ДЕСКТОПУ -->
  <div class="icons desktop-only">
    <button mat-icon-button aria-label="Settings">
      <mat-icon>settings</mat-icon>
    </button>
    <button mat-icon-button aria-label="Login">
      <mat-icon>login</mat-icon>
    </button>
  </div>

  <!-- МЕНЮ ДЛЯ МОБІЛЬНИХ -->
  <div class="mobile-only">
    <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Open menu">
      <mat-icon>menu</mat-icon>
    </button>
  </div>

  <mat-menu #menu="matMenu" xPosition="before" class="mobile-menu">
    <button mat-menu-item>
      <mat-icon>settings</mat-icon>
      <span>Settings</span>
    </button>
    <button mat-menu-item>
      <mat-icon>how_to_reg</mat-icon>
      <span>Register</span>
    </button>
  </mat-menu>
</mat-toolbar>
